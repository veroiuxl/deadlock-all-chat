[package]
name = "deadlock-chat-extractor"
version = "0.2.0"
edition = "2021"
description = "Ultra-fast zero-entity-decoding streaming chat message extractor for Deadlock Source 2 replays"

[dependencies]
anyhow = "1"
bzip2 = "0.5"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snap = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "fs", "sync"] }
zstd = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
